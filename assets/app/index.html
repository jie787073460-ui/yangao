<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Joye UI 走查工具</title>
  <style>
    :root{--bg:#f7f6f2;--surface:#fff;--surface-2:#faf9f6;--ink:#181916;--muted:#77776f;--line:#dfded7;--line-strong:#c9c8c0;--red:#e43830;--red-soft:#fff0ee;--orange:#dd8a16;--green:#42a374;--green-soft:#eef8f2;--shadow:0 10px 32px rgba(24,25,22,.06)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{color:inherit}body{overflow-x:hidden}
    .app{min-height:100vh}.topbar{height:68px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(247,246,242,.94);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
    .brand{display:flex;align-items:center;gap:11px}.brand img{width:36px;height:36px;display:block}.brand h1{font-size:20px;letter-spacing:-.5px;margin:0;font-weight:780}.brand p{display:none}.privacy{display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid #d9e8df;border-radius:999px;background:#f7fcf9;color:#356b50;font-size:12px}.privacy-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(66,163,116,.12)}
    main{max-width:1720px;margin:auto;padding:20px 24px 24px}.command{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 190px minmax(330px,.75fr);gap:10px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:15px;margin-bottom:12px}
    .source-card{min-width:0;height:80px;padding:11px 12px;display:grid;grid-template-columns:32px minmax(0,1fr) 44px;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);cursor:pointer;transition:.18s}.source-card:hover{border-color:var(--line-strong);background:#fff}.source-card.ready{border-color:#b9d1c3;background:#fbfefc}.source-card input{display:none}.step{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:800}.ready .step{border-color:var(--green);background:var(--green);color:#fff}.source-title{font-size:13px;font-weight:750;display:flex;align-items:center;gap:7px}.source-title small{font-size:10px;font-weight:700;color:var(--green)}.source-meta{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thumb{width:44px;height:54px;object-fit:cover;object-position:top;border-radius:5px;border:1px solid var(--line);background:#eeede8;opacity:0}.ready .thumb{opacity:1}
    .btn{border:0;border-radius:10px;min-height:44px;padding:0 16px;font-size:13px;font-weight:750;cursor:pointer;transition:.16s;white-space:nowrap}.btn:focus-visible,.chip:focus-visible,.zoom-btn:focus-visible,.issue:focus-visible{outline:3px solid rgba(228,56,48,.22);outline-offset:2px}.btn:disabled{opacity:.36;cursor:not-allowed}.primary{height:80px;background:#1d1f1b;color:#fff;font-size:15px}.primary:not(:disabled):hover{background:#0f100e;transform:translateY(-1px)}
    .exports{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:center;padding:8px 6px 8px 12px;border-left:1px solid var(--line)}.exports-title{grid-column:1/-1;font-size:11px;color:var(--muted);font-weight:750;margin-bottom:-2px}.secondary{background:#fff;border:1px solid var(--line);min-height:40px;padding:0 10px}.secondary:hover:not(:disabled){border-color:#aaa9a1;background:var(--surface-2)}.export-menu{display:none;position:relative}.export-menu summary{list-style:none}.export-menu summary::-webkit-details-marker{display:none}.export-pop{position:absolute;right:0;top:48px;width:190px;padding:7px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:var(--shadow);z-index:15}.export-pop button{width:100%;text-align:left;margin:2px 0}
    .progress{height:3px;background:#e8e6df;border-radius:3px;overflow:hidden;margin:0 0 10px;display:none}.progress.show{display:block}.bar{height:100%;width:0;background:var(--red);transition:width .2s}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,30vw);height:calc(100vh - 189px);min-height:650px;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}.stage{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.panel-head{height:68px;flex:0 0 68px;display:grid;grid-template-columns:minmax(170px,1fr) auto auto;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}.panel-title{font-size:13px;font-weight:780}.panel-meta{font-size:11px;color:var(--muted);margin-top:4px}.view-switch{display:flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);gap:2px}.view-btn{height:30px;padding:0 11px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:11px;font-weight:750;cursor:pointer;white-space:nowrap}.view-btn:hover{color:var(--ink);background:#fff}.view-btn.active{color:#fff;background:#222;box-shadow:0 1px 3px rgba(0,0,0,.12)}.panel-tools{display:flex;align-items:center;gap:8px}.opacity-control{height:34px;display:none;align-items:center;gap:7px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:10px;font-weight:700;white-space:nowrap}.opacity-control.show{display:flex}.opacity-control input{width:72px;accent-color:#222}.opacity-control output{min-width:28px;color:var(--ink)}.zoom{display:flex;gap:5px}.zoom-btn{height:34px;min-width:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer}.zoom-btn:hover{border-color:#aaa9a1}.zoom-value{min-width:64px}
    .canvas-scroll{flex:1;min-height:570px;overflow:auto;padding:28px;display:grid;place-items:center;background-color:#ebeae5;background-image:linear-gradient(45deg,#dfded8 25%,transparent 25%),linear-gradient(-45deg,#dfded8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dfded8 75%),linear-gradient(-45deg,transparent 75%,#dfded8 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.canvas-wrap{line-height:0;background:#fff;box-shadow:0 12px 36px rgba(24,25,22,.14)}.canvas-wrap.empty{line-height:1.55;background:transparent;box-shadow:none;text-align:center;color:var(--muted);max-width:390px;padding:48px 20px}.empty-kicker{font-size:11px;letter-spacing:.1em;color:#999;margin-bottom:8px}.empty-title{font-size:16px;font-weight:780;color:#444;margin-bottom:6px}canvas{display:block;max-width:none}
    .sidebar{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:#fff}.sidebar-head{height:62px;flex:0 0 62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.sidebar-title{font-size:15px;font-weight:800}.sidebar-count{font-size:11px;color:var(--muted);margin-top:3px}.collapse{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}
    .severity-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.severity-tab{height:86px;border:0;border-right:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;padding:14px 12px 10px;position:relative}.severity-tab:last-child{border-right:0}.severity-tab span{display:block;font-size:11px;color:var(--muted)}.severity-tab b{display:block;font-size:22px;margin-top:8px;font-weight:650}.severity-tab.active:after{content:"";position:absolute;height:3px;left:10px;right:10px;bottom:0;border-radius:3px 3px 0 0;background:var(--ink)}.severity-tab[data-filter="严重"] b{color:var(--red)}.severity-tab[data-filter="中等"] b{color:var(--orange)}.severity-tab[data-filter="轻微"] b{color:#537160}
    .type-filters{padding:11px 14px;display:flex;gap:7px;border-bottom:1px solid var(--line);overflow:auto;flex:0 0 auto}.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:11px;cursor:pointer;white-space:nowrap}.chip.active{border-color:#222;background:#222;color:#fff}.issues{flex:1;min-height:0;overflow:auto}.issue{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:start;padding:13px 14px;border:0;border-bottom:1px solid #ecebe6;background:#fff;text-align:left;width:100%;cursor:pointer;transition:.14s}.issue:hover{background:#faf9f6}.issue.active{background:var(--red-soft);box-shadow:inset 3px 0 0 var(--red)}.issue-num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#f2f1ed;font-size:10px;font-weight:800}.issue.active .issue-num{background:var(--red);color:#fff}.issue-name{font-size:12px;font-weight:780;line-height:1.35}.issue-types{display:block;margin-top:4px;color:#b92f29;font-size:10px;font-weight:750}.issue-desc{display:block;font-size:11px;color:var(--muted);line-height:1.55;margin-top:6px}.issue-part{display:block;padding:6px 0;border-top:1px dashed #dfddd6}.issue-part:first-child{border-top:0;padding-top:0}.issue-part b{display:block;color:#343530;font-size:10px;margin-bottom:2px}.issue-action{display:block;color:#6d6d66}.issue-more{display:block;margin-top:3px;color:#9b4a46;font-weight:700}.issue-geometry{display:block;margin-top:5px;color:#9a9992;font-size:10px}.badge{font-size:10px;font-weight:750;padding:4px 7px;border-radius:5px}.badge.严重{color:#b82822;background:#ffe1de}.badge.中等{color:#8a570f;background:#fff0d7}.badge.轻微{color:#41604d;background:#eaf4ee}.empty-list{padding:52px 24px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
    .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);padding:10px 14px;border-radius:9px;background:#1d1f1b;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1280px){.command{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 170px auto}.exports{display:none}.export-menu{display:block;align-self:center}.workspace{grid-template-columns:minmax(0,1fr) 330px}.view-btn{padding:0 8px}.opacity-control input{width:54px}}
    @media(max-width:820px){.topbar{padding:0 16px}.brand h1{font-size:17px}main{padding:14px}.command{grid-template-columns:1fr 1fr}.primary{height:48px}.export-menu{align-self:stretch}.export-menu summary{height:48px;display:grid;place-items:center}.workspace{grid-template-columns:1fr;height:auto;min-height:0}.stage{height:680px;border-right:0}.sidebar{height:520px;border-top:1px solid var(--line)}.canvas-scroll{min-height:0;padding:18px}}
    @media(max-width:560px){.privacy{display:none}.command{grid-template-columns:1fr}.source-card{height:70px}.primary{height:48px}.export-menu{width:100%}.source-card{grid-template-columns:32px minmax(0,1fr) 38px}.thumb{width:38px;height:46px}.zoom-btn{padding:0 8px;min-width:34px}.zoom-label{display:none}.panel-head{height:auto;flex-basis:auto;grid-template-columns:1fr auto;padding:10px 12px}.view-switch{grid-column:1/-1;grid-row:2}.view-btn{flex:1}.opacity-control{grid-column:1/-1}.canvas-scroll{padding:12px}.severity-tab{height:76px;padding:11px 8px}.severity-tab b{font-size:19px}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img src="brand-mark.png" alt=""><h1>Joye UI 走查工具</h1><p>Design fidelity inspector</p></div>
    <div class="privacy"><span class="privacy-dot"></span>本地分析 · 图片不上传</div>
  </header>
  <main>
    <section class="command" aria-label="走查工作流">
      <label class="source-card" id="designDrop">
        <input id="designInput" type="file" accept="image/png,image/jpeg,image/webp">
        <span class="step" id="designStep">1</span>
        <span><span class="source-title">上传设计稿 <small id="designStatus"></small></span><span class="source-meta" id="designMeta">PNG / JPG / WebP</span></span>
        <img class="thumb" id="designThumb" alt="设计稿缩略图">
      </label>
      <label class="source-card" id="implDrop">
        <input id="implInput" type="file" accept="image/png,image/jpeg,image/webp">
        <span class="step" id="implStep">2</span>
        <span><span class="source-title">上传实现图 <small id="implStatus"></small></span><span class="source-meta" id="implMeta">PNG / JPG / WebP</span></span>
        <img class="thumb" id="implThumb" alt="实现图缩略图">
      </label>
      <button class="btn primary" id="inspectBtn" disabled>一键走查</button>
      <div class="exports" aria-label="导出结果">
        <span class="exports-title">导出结果</span>
        <button class="btn secondary" data-export="png" disabled>验收板 PNG</button>
        <button class="btn secondary" data-export="md" disabled>Markdown</button>
        <button class="btn secondary" data-export="json" disabled>JSON</button>
      </div>
      <details class="export-menu" id="exportMenu">
        <summary class="btn secondary">导出结果</summary>
        <div class="export-pop">
          <button class="btn secondary" data-export="png" disabled>导出验收板 PNG</button>
          <button class="btn secondary" data-export="md" disabled>导出 Markdown</button>
          <button class="btn secondary" data-export="json" disabled>导出 JSON</button>
        </div>
      </details>
    </section>
    <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
    <section class="workspace">
      <div class="stage">
        <div class="panel-head">
          <div><div class="panel-title" id="panelTitle">实现图 · 差异标注</div><div class="panel-meta" id="stageMeta">等待上传两张图片</div></div>
          <div class="view-switch" id="viewSwitch" aria-label="对比方式">
            <button class="view-btn active" data-view="annotated">实现图标注</button>
            <button class="view-btn" data-view="split">平铺对比</button>
            <button class="view-btn" data-view="overlay">透明度叠加</button>
          </div>
          <div class="panel-tools">
            <label class="opacity-control" id="opacityControl">设计稿透明度<input id="overlayOpacity" type="range" min="10" max="90" value="50" step="5"><output id="opacityValue">50%</output></label>
            <div class="zoom">
              <button class="zoom-btn" id="zoomOut" aria-label="缩小">缩小</button>
              <button class="zoom-btn zoom-value" id="zoomFit">适应</button>
              <button class="zoom-btn" id="zoomIn" aria-label="放大">放大</button>
            </div>
          </div>
        </div>
        <div class="canvas-scroll" id="canvasScroll"><div class="canvas-wrap empty" id="canvasWrap"><div><div class="empty-kicker">READY FOR REVIEW</div><div class="empty-title">先上传设计稿和实现图</div><div>完成后点击“一键走查”，差异会直接标注在实现图上。</div></div></div></div>
      </div>
      <aside class="sidebar">
        <div class="sidebar-head"><div><div class="sidebar-title">问题清单</div><div class="sidebar-count" id="issueMeta">尚未开始走查</div></div><button class="collapse" id="clearSelection">取消定位</button></div>
        <div class="severity-tabs" id="severityTabs">
          <button class="severity-tab active" data-filter="全部"><span>全部</span><b id="allCount">0</b></button>
          <button class="severity-tab" data-filter="严重"><span>严重</span><b id="severeCount">0</b></button>
          <button class="severity-tab" data-filter="中等"><span>中等</span><b id="mediumCount">0</b></button>
          <button class="severity-tab" data-filter="轻微"><span>轻微</span><b id="minorCount">0</b></button>
        </div>
        <div class="type-filters" id="typeFilters"><button class="chip active" data-type="全部">全部类型</button><button class="chip" data-type="颜色">颜色</button><button class="chip" data-type="尺寸">尺寸</button><button class="chip" data-type="位置">位置</button><button class="chip" data-type="文字">文字</button><button class="chip" data-type="圆角">圆角</button><button class="chip" data-type="阴影">阴影</button><button class="chip" data-type="边框">边框</button><button class="chip" data-type="图标">图标</button><button class="chip" data-type="布局">布局</button></div>
        <div class="issues" id="issues"><div class="empty-list">走查完成后，问题会按严重程度显示在这里。<br>点击问题可定位画布标注。</div></div>
      </aside>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const S={design:null,impl:null,issues:[],groups:[],active:null,filter:'全部',type:'全部',scale:1,view:'annotated',opacity:.5,coverage:null,profile:null};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],wrap=$('#canvasWrap'),scroll=$('#canvasScroll');let canvas=null,ctx=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2200)}
function loadImage(file,key){if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{if(S[key]?.url)URL.revokeObjectURL(S[key].url);S[key]={img,url,file};const design=key==='design';$(design?'#designMeta':'#implMeta').textContent=`${file.name} · ${img.naturalWidth}×${img.naturalHeight}`;$(design?'#designDrop':'#implDrop').classList.add('ready');$(design?'#designStatus':'#implStatus').textContent='已就绪';const thumb=$(design?'#designThumb':'#implThumb');thumb.src=url;$('#inspectBtn').disabled=!(S.design&&S.impl);if(!design)prepareCanvas();if(S.design&&S.impl){S.profile=buildComparisonProfile(S.design.img,S.impl.img);S.coverage=null;updateStageMeta();draw()}};img.onerror=()=>{URL.revokeObjectURL(url);toast('图片读取失败，请换一张图片重试')};img.src=url}
$('#designInput').onchange=e=>loadImage(e.target.files[0],'design');$('#implInput').onchange=e=>loadImage(e.target.files[0],'impl');
function buildComparisonProfile(design,impl){const dw=design.naturalWidth,dh=design.naturalHeight,w=impl.naturalWidth,h=impl.naturalHeight,widthDelta=Math.abs(dw-w)/Math.max(dw,w),designAspect=dh/dw,implAspect=h/w,aspectDelta=Math.abs(designAspect-implAspect)/Math.max(.1,implAspect),mobilePortrait=implAspect>1.45&&w<=1600,ignoreTop=mobilePortrait?Math.round(Math.min(h*.075,w*.12)):0;let mode,label,confidence;if(widthDelta<=.015){mode='exact';label='精确像素';confidence=aspectDelta<.03?98:91}else if(widthDelta<=.35&&aspectDelta<=.3){mode='responsive';label='响应式归一';confidence=Math.max(68,Math.round(94-widthDelta*55-aspectDelta*35))}else{mode='conservative';label='保守比较';confidence=Math.max(45,Math.round(72-widthDelta*25-aspectDelta*18))}return{mode,label,confidence,ignoreTop,mobilePortrait,designWidth:dw,implementationWidth:w,widthScale:w/dw}}
function prepareCanvas(){wrap.className='canvas-wrap';wrap.innerHTML='<canvas id="resultCanvas"></canvas>';canvas=$('#resultCanvas');ctx=canvas.getContext('2d');configureCanvas()}
function configureCanvas(){if(!canvas||!S.impl)return;const W=S.impl.img.naturalWidth,H=S.impl.img.naturalHeight;canvas.width=S.view==='split'?W*2:W;canvas.height=H;fitScale();draw();updateStageMeta()}
function updateStageMeta(){if(!S.impl){$('#stageMeta').textContent='等待上传两张图片';return}const W=S.impl.img.naturalWidth,H=S.impl.img.naturalHeight,mode=S.view==='split'?'平铺':S.view==='overlay'?`叠加 ${Math.round(S.opacity*100)}%`:'实现图',coverage=S.coverage==null?'':` · 覆盖 ${S.coverage}%`,profile=S.profile?` · ${S.profile.label} ${S.profile.confidence}%${S.profile.ignoreTop?` · 忽略状态栏 ${S.profile.ignoreTop}px`:''}`:'';$('#stageMeta').textContent=`${W} × ${H} · ${mode}${profile}${S.groups.length?` · ${S.groups.length} 个问题组 / ${S.issues.length} 项差异${coverage}`:''}`}
function fitScale(){if(!canvas)return;const max=Math.max(260,scroll.clientWidth-56);S.scale=Math.min(1,max/canvas.width);applyScale()}
function applyScale(){if(!canvas)return;canvas.style.width=Math.round(canvas.width*S.scale)+'px';canvas.style.height=Math.round(canvas.height*S.scale)+'px';$('#zoomFit').textContent=Math.round(S.scale*100)+'%'}
$('#zoomIn').onclick=()=>{S.scale=Math.min(2,S.scale+.15);applyScale()};$('#zoomOut').onclick=()=>{S.scale=Math.max(.15,S.scale-.15);applyScale()};$('#zoomFit').onclick=fitScale;
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function boxIntersection(a,b){const x=Math.max(a.x,b.x),y=Math.max(a.y,b.y),r=Math.min(a.x+a.w,b.x+b.w),bt=Math.min(a.y+a.h,b.y+b.h);return Math.max(0,r-x)*Math.max(0,bt-y)}
function isStatusBarOnly(box,profile=S.profile){const bottom=profile?.ignoreTop||0;if(!bottom||!box)return false;const height=Math.max(1,box.h),overlap=Math.max(0,Math.min(box.y+height,bottom)-Math.max(0,box.y)),buffer=Math.max(4,Math.round((profile?.implementationWidth||1000)*.015));return box.y+height<=bottom+buffer||box.y+height/2<bottom||overlap/height>=.72}
function excludeStatusBarIssues(issues,profile=S.profile){return issues.filter(issue=>!isStatusBarOnly(issue.box,profile))}
function unionBox(boxes){const x=Math.min(...boxes.map(b=>b.x)),y=Math.min(...boxes.map(b=>b.y)),r=Math.max(...boxes.map(b=>b.x+b.w)),bt=Math.max(...boxes.map(b=>b.y+b.h));return{x,y,w:r-x,h:bt-y}}
